<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书循环 · 校园二手教材平台</title>
<style>
:root{
  --green:#2e7d4f; --green-l:#e8f5ee; --green-d:#1b5136;
  --orange:#e8862e; --bg:#f6f8f6; --card:#ffffff;
  --ink:#22302a; --muted:#7a8a82; --line:#e3eae5; --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
button{cursor:pointer;font-family:inherit}

/* ===== 顶栏 ===== */
header{background:linear-gradient(135deg,var(--green-d),var(--green));color:#fff;padding:18px 6vw;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.15)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:1px}
.logo .ico{width:38px;height:38px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.12);border:none;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;transition:.2s}
nav button:hover{background:rgba(255,255,255,.28)}
nav button.on{background:#fff;color:var(--green-d);font-weight:700}
.publish-btn{background:var(--orange)!important;font-weight:700}

/* ===== 统计横幅 ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;padding:20px 6vw 6px}
.stat{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:0 1px 6px rgba(0,0,0,.06);text-align:center}
.stat .num{font-size:28px;font-weight:800;color:var(--green)}
.stat .num em{font-style:normal;color:var(--orange)}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}

/* ===== 主体 ===== */
main{padding:14px 6vw 60px;max-width:1280px;margin:0 auto;width:100%}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.searchbar input{flex:1;min-width:200px;padding:11px 16px;border:1.5px solid var(--line);border-radius:24px;font-size:14px;outline:none;background:#fff;transition:.2s}
.searchbar input:focus{border-color:var(--green)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 15px;border-radius:18px;border:1.5px solid var(--line);background:#fff;font-size:13px;color:var(--muted);transition:.15s}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}

/* ===== 卡片 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.book{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.07);transition:.2s;display:flex;flex-direction:column;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.book:hover{transform:translateY(-4px);box-shadow:0 8px 22px rgba(0,0,0,.13)}
.cover{height:130px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;position:relative}
.cover .tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.35);color:#fff;font-size:11px;padding:3px 10px;border-radius:10px;backdrop-filter:blur(4px)}
.cover .cond{position:absolute;top:10px;right:10px;background:#fff;font-size:11px;padding:3px 8px;border-radius:10px;font-weight:700}
.cover .needtag{position:absolute;bottom:10px;left:10px;background:#e5453a;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;font-weight:700;box-shadow:0 2px 8px rgba(229,69,58,.35)}
.book .body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
.book h3{font-size:15.5px;line-height:1.35}
.book .course{font-size:12px;color:var(--muted)}
.book .course b{color:var(--orange);font-weight:600}
.book .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto}
.price{color:#d34e2a;font-weight:800;font-size:19px}
.price s{color:#b9c4bd;font-size:12px;font-weight:400;margin-left:4px}
.book .acts{display:flex;gap:6px}
.mini{border:none;border-radius:8px;padding:6px 10px;font-size:12px;background:var(--green-l);color:var(--green-d);font-weight:600}
.mini:hover{background:var(--green);color:#fff}
.book .seller{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.avatar{width:20px;height:20px;border-radius:50%;background:var(--green-l);color:var(--green-d);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.sold{opacity:.55;filter:grayscale(.6)}
.sold .stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sold .stamp span{border:2.5px solid #d34e2a;color:#d34e2a;font-weight:800;padding:4px 18px;border-radius:8px;transform:rotate(-14deg);font-size:18px;background:rgba(255,255,255,.75)}

.empty{text-align:center;color:var(--muted);padding:60px 0;grid-column:1/-1}

/* ===== 求购墙 ===== */
.wanted{display:flex;flex-direction:column;gap:12px}
.wcard{background:#fff;border-radius:var(--radius);padding:16px 20px;box-shadow:0 1px 6px rgba(0,0,0,.06);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.wcard .badge{background:#fdf1e4;color:var(--orange);font-weight:700;font-size:13px;padding:6px 12px;border-radius:10px;white-space:nowrap}
.wcard .info{flex:1;min-width:180px}
.wcard .info b{font-size:15px}
.wcard .info .sub{font-size:12px;color:var(--muted);margin-top:3px}
.wcard .match{background:var(--green-l);color:var(--green-d);font-size:12.5px;padding:6px 12px;border-radius:18px;font-weight:600}
.match.none{background:#f0f2f0;color:var(--muted)}

/* ===== 匹配面板 ===== */
.matchbox{background:linear-gradient(135deg,#fff8f1,#fff);border:1.5px solid #f5ddc0;border-radius:var(--radius);padding:20px 22px;margin-bottom:18px}
.matchbox h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.matchline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;flex-wrap:wrap}
.matchline:last-child{border:none}
.arrow{color:var(--green);font-weight:800}
.rate{background:var(--green);color:#fff;font-size:11px;padding:2px 9px;border-radius:10px}

/* ===== 弹窗 ===== */
.mask{position:fixed;inset:0;background:rgba(20,30,25,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:18px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:26px 28px;animation:pop .25s ease}
.modal h2{font-size:19px;margin-bottom:4px}
.modal .tip{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;outline:none;font-family:inherit;transition:.15s}
.field input:focus,.field select:focus{border-color:var(--green)}
.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btnrow{display:flex;gap:10px;margin-top:6px}
.btn-primary{flex:1;background:var(--green);color:#fff;border:none;padding:12px;border-radius:11px;font-size:15px;font-weight:700;transition:.2s}
.btn-primary:hover{background:var(--green-d)}
.btn-ghost{background:#eef2ef;border:none;padding:12px 22px;border-radius:11px;font-size:14px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 26px;border-radius:24px;font-size:14px;z-index:200;transition:.35s;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%);opacity:1}
.detail-cover{height:170px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;margin-bottom:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.kv .k{font-size:11.5px;color:var(--muted)}
.kv .v{font-size:14px;font-weight:600;margin-top:2px}
.msgs{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:13px;max-height:130px;overflow:auto;margin:10px 0}
.msgs p{padding:4px 0;border-bottom:1px dashed var(--line)}
.msgs p:last-child{border:none}
.msgs b{color:var(--green-d)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 0 40px}
@media(max-width:600px){.fieldrow{grid-template-columns:1fr}.stats{padding:14px 4vw 4px}main{padding:10px 4vw 50px}}

/* 新求购提醒角标 */
nav button{position:relative}
nav button .dot{
  position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;line-height:18px;
  padding:0 5px;border-radius:9px;background:#e5453a;color:#fff;font-size:11px;
  font-weight:700;text-align:center;box-shadow:0 2px 6px rgba(229,69,58,.45);
  animation:pop .3s ease;
}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

/* 新求购强提醒条 */
#noticeBar{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(180%);
  z-index:9998;width:min(520px,92vw);background:linear-gradient(135deg,#e5453a,#c9342a);color:#fff;
  border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 12px 34px rgba(201,52,42,.42);transition:transform .32s cubic-bezier(.2,1.3,.4,1);}
#noticeBar.show{transform:translateX(-50%) translateY(0)}
#noticeBar .nt-t{flex:1;font-size:14px;line-height:1.4;font-weight:700;min-width:0}
#noticeBar .nt-t small{display:block;font-weight:400;opacity:.9;font-size:12px;margin-top:3px}
#noticeBar .nt-go{background:#fff;color:#c9342a;border:none;border-radius:18px;padding:8px 13px;font-size:13px;font-weight:700;white-space:nowrap}
#noticeBar .nt-x{background:transparent;border:none;color:#fff;font-size:17px;opacity:.7;padding:2px 4px}

/* 求购卡片未读标记 */
.wcard.is-new{border-left:4px solid #e5453a;background:#fff7f6}
.newtag{background:#e5453a;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;margin-left:6px;vertical-align:middle}

/* ===== 消息 ===== */
.thread{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer;transition:.15s}
.thread:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.thread .av{width:42px;height:42px;border-radius:50%;background:var(--green-l);color:var(--green-d);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 42px}
.thread .tx{flex:1;min-width:0}
.thread .tx b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .tx span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.thread .ud{background:#e5453a;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;padding:0 5px}
.thread .tm{font-size:11px;color:var(--muted);flex:0 0 auto}

#chatModal{width:min(520px,100%);padding:0;display:flex;flex-direction:column;max-height:82vh;overflow:hidden}
.chat-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.chat-h b{font-size:15px}
.chat-h small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400}
.chat-b{padding:16px;overflow:auto;flex:1;background:var(--bg);min-height:240px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.45;word-break:break-word}
.bub.them{background:#fff;align-self:flex-start;border:1px solid var(--line)}
.bub.me{background:var(--green);color:#fff;align-self:flex-end}
.bub small{display:block;font-size:10px;opacity:.7;margin-top:3px}
.chat-i{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
.chat-i input{flex:1;padding:10px 14px;border:1.5px solid var(--line);border-radius:20px;outline:none;font-size:14px;font-family:inherit}
.chat-i input:focus{border-color:var(--green)}
.chat-i button{background:var(--green);color:#fff;border:none;border-radius:20px;padding:0 18px;font-weight:700;font-size:14px}
.mini-btn{background:var(--green-l);color:var(--green-d);border:1px solid #cfe6da;border-radius:16px;padding:6px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.mini-btn:hover{background:#d9efe3}
</style>
</head>
<body>

<div id="noticeBar">
  <div class="nt-t" id="ntText"></div>
  <button class="nt-go" id="ntGo">去看看 →</button>
  <button class="nt-x" onclick="hideNotice()">✕</button>
</div>

<header>
  <div class="hbar">
    <div class="logo"><span class="ico">📚</span>书循环 · 校园二手教材平台</div>
    <nav>
      <button id="nav-sale" class="on" onclick="go('sale')">在售教材</button>
      <button id="nav-wanted" onclick="go('wanted')">求购墙</button>
      <button id="nav-match" onclick="go('match')">智能匹配</button>
      <button id="nav-msg" onclick="go('msg')">消息</button>
      <button class="publish-btn" onclick="openPublish()">＋ 发布教材</button>
      <button onclick="openWantedForm()">我要求购</button>
    </nav>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="num" id="st-books">0</div><div class="lbl">在售教材（本）</div></div>
  <div class="stat"><div class="num" id="st-sold">0</div><div class="lbl">已循环（本）</div></div>
  <div class="stat"><div class="num" id="st-save">¥0</div><div class="lbl">为同学节省（元）</div></div>
  <div class="stat"><div class="num"><em id="st-wanted">0</em></div><div class="lbl">求购需求（条）</div></div>
</div>

<main>
  <!-- 在售 -->
  <section id="page-sale">
    <div class="searchbar">
      <input id="kw" placeholder="🔍 搜索书名 / 课程 / 老师昵称，如：化工原理" oninput="render()">
      <div class="chips" id="catChips"></div>
    </div>
    <div class="grid" id="bookGrid"></div>
  </section>

  <!-- 求购墙 -->
  <section id="page-wanted" style="display:none">
    <div class="wanted" id="wantedList"></div>
  </section>

  <!-- 智能匹配 -->
  <section id="page-match" style="display:none">
    <div class="matchbox">
      <h3>🤝 供需智能匹配</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:6px">系统按「课程代码 + 教材版本 + 价格区间」自动撮合求购需求与在售教材，优先推荐同宿舍楼卖家，当面交易零运费。</p>
      <div id="matchList"></div>
    </div>
  </section>

  <!-- 消息 -->
  <section id="page-msg" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;flex-wrap:wrap;gap:10px">
      <div style="font-size:13px;color:var(--muted)">我现在的身份：<b id="meName" style="color:var(--ink)"></b>
        <button class="mini-btn" style="margin-left:8px" onclick="setMe()">改名</button>
      </div>
      <div style="font-size:12.5px;color:var(--muted)">和求购的同学、想买你书的同学在这里直接聊</div>
    </div>
    <div id="threadList"></div>
  </section>
</main>

<footer>书循环 demo · 创新创业课程结业作品 · 数据仅存于本机浏览器，刷新后发布内容保留</footer>

<!-- 发布弹窗 -->
<div class="mask" id="pubMask">
  <div class="modal">
    <h2>📖 发布二手教材</h2>
    <p class="tip">填完点击发布，立即上架到「在售教材」</p>
    <div class="field"><label>书名 *</label><input id="p-title" placeholder="如：化工原理（上册）"></div>
    <div class="fieldrow">
      <div class="field"><label>课程名称</label><input id="p-course" placeholder="如：化工原理"></div>
      <div class="field"><label>分类</label><select id="p-cat"><option>专业教材</option><option>公共课</option><option>考研考证</option><option>工具书</option></select></div>
    </div>
    <div class="fieldrow">
      <div class="field"><label>原价（元）</label><input id="p-orig" type="number" placeholder="59"></div>
      <div class="field"><label>售价（元）*</label><input id="p-price" type="number" placeholder="20"></div>
    </div>
    <div class="fieldrow">
      <div class="field"><label>成色</label><select id="p-cond"><option>九成新</option><option>八成新</option><option>有笔记标注</option><option>轻微磨损</option></select></div>
      <div class="field"><label>你的昵称</label><input id="p-seller" placeholder="如：大三学长"></div>
    </div>
    <div class="field"><label>备注</label><input id="p-note" placeholder="如：含期末复习笔记，8栋宿舍自提"></div>
    <div class="btnrow">
      <button class="btn-ghost" onclick="closeMask('pubMask')">取消</button>
      <button class="btn-primary" onclick="doPublish()">立即发布</button>
    </div>
  </div>
</div>

<!-- 求购弹窗 -->
<div class="mask" id="wantMask">
  <div class="modal">
    <h2>🙋 发布求购需求</h2>
    <p class="tip">写下你下学期要用的书，系统自动为你匹配卖家</p>
    <div class="field"><label>想买的书 *</label><input id="w-title" placeholder="如：物理化学（第五版）"></div>
    <div class="fieldrow">
      <div class="field"><label>课程名称</label><input id="w-course" placeholder="如：物理化学"></div>
      <div class="field"><label>期望价格（元）</label><input id="w-price" type="number" placeholder="25"></div>
    </div>
    <div class="field"><label>你的昵称</label><input id="w-name" placeholder="如：26级新生"></div>
    <div class="btnrow">
      <button class="btn-ghost" onclick="closeMask('wantMask')">取消</button>
      <button class="btn-primary" onclick="doWanted()">发布求购</button>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="mask" id="detailMask">
  <div class="modal" id="detailBody"></div>
</div>

<div class="toast" id="toast"></div>

<!-- 聊天弹窗 -->
<div class="mask" id="chatMask">
  <div class="modal" id="chatModal">
    <div class="chat-h">
      <div><b id="chatTitle">对话</b><small id="chatSub"></small></div>
      <button class="btn-ghost" style="padding:6px 12px" onclick="closeMask('chatMask')">关闭</button>
    </div>
    <div class="chat-b" id="chatBody"></div>
    <div class="chat-i">
      <input id="chatInput" placeholder="说点什么，比如：书还在，明天下午图书馆门口？" onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">发送</button>
    </div>
  </div>
</div>

<script>
const CAT_COLORS={"专业教材":"#2e7d4f","公共课":"#3b6ea5","考研考证":"#8a5cbf","工具书":"#c07830"};
const CAT_EMOJI={"专业教材":"🧪","公共课":"📐","考研考证":"📝","工具书":"📎"};

let books=[
 {id:1,title:"化工原理（上册）第5版",course:"化工原理 / 王老师班",cat:"专业教材",orig:59,price:20,cond:"有笔记标注",seller:"大三·陈学长",note:"含手写期末重点整理，8栋可自提",sold:false},
 {id:2,title:"物理化学（第五版）下册",course:"物理化学 / 李老师班",cat:"专业教材",orig:62,price:25,cond:"九成新",seller:"考研上岸·周学姐",note:"考研上岸出书，几乎没写字",sold:false},

}

let audioCtx=null;
function beep(){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  [0,0.16].forEach((t,i)=>{
   const o=audioCtx.createOscillator(), g=audioCtx.createGain();
   o.type="sine"; o.frequency.value=i?1046:880;
   g.gain.setValueAtTime(0.0001,audioCtx.currentTime+t);
   g.gain.exponentialRampToValueAtTime(0.18,audioCtx.currentTime+t+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+t+0.14);
   o.connect(g); g.connect(audioCtx.destination);
   o.start(audioCtx.currentTime+t); o.stop(audioCtx.currentTime+t+0.16);
  });
 }catch(e){}
}

function sortBooks(arr){
 const big=arr.filter(b=>Number(b.id)>1e12).sort((a,b)=>Number(b.id)-Number(a.id));
 const small=arr.filter(b=>Number(b.id)<=1e12);
 return big.concat(small);
}
function sortWanted(arr){
 const big=arr.filter(w=>Number(w.id)>1e12).sort((a,b)=>Number(b.id)-Number(a.id));
 const small=arr.filter(w=>Number(w.id)<=1e12);
 return big.concat(small);
}

let msgBaseline=false;
function adopt(d){
 if(!d || !Array.isArray(d.books)) return;
 const s1=sig();
 const oldMsgs=msgs;
 if(Array.isArray(d.books)) books=sortBooks(d.books);
 if(Array.isArray(d.wanted)) wanted=sortWanted(d.wanted);
 if(d.msgs) msgs=d.msgs;
 const s2=sig();

 // 第一次进这个浏览器：把已有求购当基线，不一次性炸一堆提醒
 if(!hasBaseline){
  hasBaseline=true;
  markSeen(wanted.map(w=>w.id));
 }else{
  // 之后只要出现"我没见过、也不是我自己发的"求购，就提醒
  const fresh=wanted.filter(w=>!selfIds.has(String(w.id)) && !seenWanted.has(String(w.id)));
  if(fresh.length){
   fresh.forEach(w=>unreadWanted.add(String(w.id)));
   markSeen(fresh.map(w=>w.id));
   persistUnread();
   notifyWanted(fresh);
  }
 }

 // 新消息：只提醒"和我有关"的会话，自己发的不算
 if(msgBaseline){
  const freshMsg=[];
  Object.keys(msgs).forEach(k=>{
   if(!isMyThread(k)) return;
   const before=new Set((oldMsgs[k]||[]).map(x=>x.id));
   (msgs[k]||[]).forEach(x=>{ if(!before.has(x.id)&&x.uid!==me.id) freshMsg.push({k,x}); });
  });
  if(freshMsg.length){
   freshMsg.sort((a,b)=>(a.x.ts||0)-(b.x.ts||0));
   notifyMsg(freshMsg);
   if(chatKey===freshMsg[0].k) renderChat();
  }
 }else{ msgBaseline=true; }
 updateMsgBadge();

 if(s1!==s2){ lastSig=s2; paint(); }
}

async function push(){
 if(!SYNCED) return false;
 try{
  const r=await fetch(apiUrl("/api/data"),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({books,wanted,msgs})
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
  const d=await r.json();
  SYNCED=true; setBadge(true);
  adopt(d);
  return true;
 }catch(e){ SYNCED=false; setBadge(false); return false; }
}

 return await push();
}

// 轮询：别人发布的内容几秒内自动出现在你屏幕上
let pollTimer=null, failCount=0, offlineNotified=false;
// 8 秒超时，避免服务器无响应时请求越堆越多
async function getJSON(path,ms=8000){
 const c=new AbortController();
 const t=setTimeout(()=>c.abort(),ms);
 try{
  const r=await fetch(path,{cache:"no-store",signal:c.signal});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
 }finally{ clearTimeout(t); }
}
async function pollNow(){
 if(!SYNCED){ await initShared(); return; }
 try{
  const d=await getJSON(apiUrl("/api/data"));
  failCount=0; offlineNotified=false; SYNCED=true; setBadge(true);
  adopt(d);
 }catch(e){
  failCount++;
  // 连续失败才算掉线，避免偶发超时误报
  if(failCount>=2){
   SYNCED=false; setBadge(false);
   if(!offlineNotified){
    offlineNotified=true;
    toast("⚠️ 与服务器断开，正在自动重连…");
   }
  }
 }
}
function startPolling(){
 if(pollTimer) clearInterval(pollTimer);
 // 2 秒一次，够快；切回页面时还会立即补一次
 pollTimer=setInterval(pollNow,2000);
}
// 手机切到微信再切回来，浏览器会限制定时器，这里立刻补拉一次
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) pollNow(); });
window.addEventListener("focus",()=>pollNow());
window.addEventListener("online",()=>{ failCount=0; pollNow(); });

async function initShared(){
 try{
  const d=await getJSON(apiUrl("/api/data"));
  SYNCED=true;

  if(d && Array.isArray(d.books) && d.books.length>0){
   // 服务端已有数据：只读拉取，绝不覆盖，避免重复
   adopt(d);
  }else{
   // 服务端为空：把本地/示例数据播种上去
   const r2=await fetch(apiUrl("/api/data"),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({books,wanted,msgs})
   });
   adopt(await r2.json());
  }
  lastSig=sig();
  setBadge(true);
  failCount=0; offlineNotified=false;
  navBadge();
  // 刷新后如果还有没看的求购，横幅继续挂着，不会“一刷新就消失”
  const un=wanted.filter(w=>unreadWanted.has(String(w.id)));
  if(un.length) showNotice(un);
 }catch(e){
  SYNCED=false;
  setBadge(false);
 }
 // 无论首连成功与否都要开始轮询，否则断线后永远连不回来
 startPolling();
}

function setBadge(ok){
 let el=document.getElementById("syncBadge");
 if(!el){
  el=document.createElement("div");
  el.id="syncBadge";
  el.style.cssText="position:fixed;right:14px;bottom:14px;z-index:9999;font-size:12px;"+
   "padding:8px 14px;border-radius:22px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.22);"+
   "font-family:inherit;cursor:pointer;transition:.25s;user-select:none";
  el.onclick=()=>{
   if(el.dataset.off==="1"){ toast("正在重连…"); SYNCED=false; failCount=0; pollNow(); return; }
   const u=location.origin;
   navigator.clipboard&&navigator.clipboard.writeText(u);
   toast("网址已复制：" + u);
  };
  document.body.appendChild(el);
 }
 el.dataset.off = ok ? "0" : "1";
 el.textContent = ok ? "🌐 已联网 · 实时同步" : "⚠️ 已断线 · 点此重连";
 el.style.background = ok ? "linear-gradient(135deg,#1f8a5a,#2fb37a)" : "#e5453a";
 el.title = ok ? "点击复制网址，发给同学手机打开" : "未连上服务端，数据只在本机，点击重试";
}

  closeMask("detailMask");

  try {
    // 1. 服务端创建订单（锁定价格）
    const res = await fetch(apiUrl("/api/order/create"), {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-User-Id": me.id,
        "X-User-Name": encodeURIComponent(me.name)
      },
      body: JSON.stringify({ bookId: b.id })
    });
    const data = await res.json();
    if (!data.ok) return toast(data.msg || "创建订单失败");

    currentOrder = data.order;

    // 显示支付确认弹窗
    $("payBody").innerHTML = `
      <h2>💳 在线支付</h2>
      <p class="tip">确认支付后将完成交易</p>
      <div style="text-align:center;font-size:36px;font-weight:800;color:#d34e2a;margin:16px 0">${money(currentOrder.price)}</div>
      <div style="font-size:14px;margin-bottom:8px">《${esc(currentOrder.title)}》</div>
      <div style="font-size:14px;margin-bottom:18px;text-align:center">《${esc(currentOrder.title)}》</div>
      <div class="btnrow">
        <button class="btn-ghost" onclick="closeMask('payMask')">取消</button>
        <button class="btn-primary" style="background:linear-gradient(135deg,#ff9a3d,#f2700d)" onclick="doSecurePay()">确认支付</button>
      </div>`;
    openMask("payMask");
  } catch (e) {
    console.error(e);
    toast("网络错误，请确认本地后端已启动 (node server.js)");
  }
}

async function doSecurePay(){
  if (!currentOrder) return toast("订单已失效，请重新发起");

  try {
    // 2. 发起支付
    const payRes = await fetch(apiUrl("/api/order/pay"), {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-User-Id": me.id,
        "X-User-Name": encodeURIComponent(me.name)
      },
      body: JSON.stringify({
        orderId: currentOrder.id,
        clientNonce: currentOrder.clientNonce
      })
    });
    const payData = await payRes.json();
    if (!payData.ok) return toast(payData.msg || "发起支付失败");

    // 3. 模拟支付回调
    const notifyRes = await fetch(apiUrl("/api/pay/notify"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        orderId: currentOrder.id,
        payToken: payData.payToken,
        amount: payData.amount
      })
    });
    const notifyData = await notifyRes.json();
    if (!notifyData.ok) return toast(notifyData.msg || "支付回调失败");

    // 刷新数据
    if (typeof pollNow === "function") await pollNow();
    render(); updateStats();
    if (typeof renderThreads === "function") renderThreads();

    $("payBody").innerHTML = `
      <div style="text-align:center;font-size:48px;margin:10px 0">✅</div>
      <h2 style="text-align:center">支付成功</h2>
      <div style="text-align:center;font-size:28px;font-weight:800;color:#d34e2a;margin:12px 0">${money(currentOrder.price)}</div>
      <div style="text-align:center;font-size:14px;margin-bottom:8px">《${esc(currentOrder.title)}》</div>
      <div style="font-size:13px;color:var(--muted);text-align:center;line-height:1.8;margin-bottom:18px">
        订单号：${currentOrder.id}<br>
        交易已完成，请与卖家约定交书时间
      </div>
      <div class="btnrow">
        <button class="btn-ghost" onclick="closeMask('payMask')">关闭</button>
        <button class="btn-primary" onclick="closeMask('payMask');openChat('b_'+${payingBookId},'我已支付，约个时间交书吧')">联系卖家交书</button>
      </div>`;
  } catch (e) {
    console.error(e);
    toast("支付过程出错，请确认后端已启动");
  }
}


/* ===== 聊天 ===== */
let chatKey="";
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function addMsg(k,txt){
 const m={id:"m"+Date.now()+Math.random().toString(36).slice(2,6),uid:me.id,name:me.name,txt,ts:Date.now()};
 (msgs[k]=msgs[k]||[]).push(m);
 markRead(k);
 save();
}
function openChat(k,preset){
 chatKey=k; join(k);
 const m=threadMeta(k);
 $("chatTitle").textContent=(m.kind==="w"?"求购《"+m.title+"》":"《"+m.title+"》");
 $("chatSub").textContent=(m.who?"对方："+m.who+"　":"")+"我："+me.name;
 $("chatInput").value=preset||"";
 renderChat(); markRead(k); updateMsgBadge(); renderThreads();
 openMask("chatMask");
 setTimeout(()=>{try{$("chatInput").focus()}catch(e){}},200);
}
function renderChat(){
 const body=$("chatBody"); if(!body)return;
 const arr=(msgs[chatKey]||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
 if(!arr.length){ body.innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;margin:auto">还没有消息，先打个招呼 👋</div>'; return; }
 body.innerHTML=arr.map(x=>{
  const mine=x.uid===me.id, t=new Date(x.ts||Date.now());
  const hm=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
  return `<div class="bub ${mine?"me":"them"}">${esc(x.txt)}<small>${mine?"我":esc(x.name||"对方")} · ${t.getMonth()+1}/${t.getDate()} ${hm}</small></div>`;
 }).join("");
 body.scrollTop=body.scrollHeight;
}
function sendChat(){
 const v=$("chatInput").value.trim();
 if(!v)return;
 addMsg(chatKey,v);
 $("chatInput").value="";
 renderChat(); renderThreads(); updateMsgBadge();
}
function contactWanted(id){
 const w=wantedById(id); if(!w)return;
 const myBook=books.find(b=>!b.sold && b.uid===me.id &&
  (b.title.includes(w.title.slice(0,4)) || (w.course && b.course.includes(w.course.slice(0,3)))));
 const t=myBook?myBook.title:w.title;
 const p=myBook?myBook.price:(w.price||"面议");
 openChat("w_"+w.id,"同学你好，我有《"+t+"》，¥"+p+" 可以吗？");
}
function contactBook(id){
 const b=bookById(id); if(!b)return;
 openChat("b_"+b.id,"同学你好，《"+b.title+"》还在吗？");
}
function renderThreads(){
 const el=$("threadList"); if(!el)return;
 const nm=$("meName"); if(nm)nm.textContent=me.name;
 const ks=myThreads();
 if(!ks.length){
  el.innerHTML='<div style="background:#fff;border-radius:12px;padding:36px 20px;text-align:center;color:var(--muted);font-size:13.5px">还没有消息<br><span style="font-size:12.5px;display:inline-block;margin-top:6px">去「求购墙」点「我有这本书」，就能直接和求购的同学聊</span></div>';
  return;
 }
 el.innerHTML=ks.map(k=>{
  const m=threadMeta(k), arr=(msgs[k]||[]).slice().sort((a,b)=>(a.ts||0)-(b.ts||0)), last=arr[arr.length-1]||{}, n=unreadOf(k);
  return `<div class="thread" onclick="openChat('${k}')">
   <div class="av">${m.kind==="w"?"🙋":"📘"}</div>
   <div class="tx"><b>${m.kind==="w"?"求购":"在售"}：${esc(m.title)}</b>
    <span>${esc((last.uid===me.id?"我：":"")+(last.txt||""))}</span></div>
   ${n?`<span class="ud">${n}</span>`:""}
   <span class="tm">${last.ts?timeAgo(last.ts):""}</span>
  </div>`;
 }).join("");
}
function timeAgo(ts){
 const d=Date.now()-ts;
 if(d<60000)return "刚刚";
 if(d<3600000)return Math.floor(d/60000)+" 分钟前";
 const t=new Date(ts); return (t.getMonth()+1)+"/"+t.getDate();
}
function updateMsgBadge(){
 const btn=$("nav-msg"); if(!btn)return;
 const n=myThreads().reduce((s,k)=>s+unreadOf(k),0);
 let b=btn.querySelector(".dot");
 if(n>0){ if(!b){b=document.createElement("span");b.className="dot";btn.appendChild(b);} b.textContent=n>99?"99+":n; }
 else if(b){ b.remove(); }
}

/* 求购墙 */
function renderWanted(){
 $("wantedList").innerHTML=wanted.map(w=>{
  const hit=bestMatch(w);
  const isNew=unreadWanted.has(String(w.id));
  const mine=w.uid&&w.uid===me.id;
  const n=unreadOf("w_"+w.id);
  // 我自己的在售书里，有没有能对上这条求购的
  const myBook=books.find(b=>!b.sold && b.uid===me.id &&
    (b.title.includes(w.title.slice(0,4)) || (w.course && b.course.includes(w.course.slice(0,3)))));
  const btn=myBook
    ? `<button class="mini-btn" style="background:#fff3e6;border-color:#f2d3ab;color:#a85b12" onclick="contactWanted(${w.id})">卖我的这本${n?" · "+n:""}</button>`
    : `<button class="mini-btn" onclick="contactWanted(${w.id})">我有这本书${n?" · "+n:""}</button>`;
  return `<div class="wcard${isNew?" is-new":""}">
   <span class="badge">求购</span>
   <div class="info"><b>${esc(w.title)}</b>${isNew?'<span class="newtag">新</span>':""}<div class="sub">${esc(w.course)} · 期望 ¥${w.price} · ${esc(w.name)}</div></div>
   ${mine?`<span class="match none">我的求购</span>`:btn}
   ${hit?`<span class="match">✅ 已匹配：《${esc(hit.title)}》¥${hit.price}（${esc(hit.seller)}）</span>`:`<span class="match none">⏳ 暂无匹配，等待上架</span>`}
  </div>`}).join("");
}
function bestMatch(w){
 const kw=(w.title.match(/[\u4e00-\u9fa5a-zA-Z]+/g)||[""]).join("").toLowerCase();
 return books.find(b=>!b.sold&&b.price<=w.price&&(
   b.title.includes(w.title.slice(0,4))||
   (w.course&&b.course.includes(w.course.slice(0,3)))
 ));
}

/* 智能匹配 */
function renderMatch(){
 const lines=wanted.map(w=>{
  const hit=bestMatch(w);
  if(!hit)return `<div class="matchline">⏳ 「${w.title}」（${w.name}，预算¥${w.price}）<span class="match none">暂无货源</span></div>`;
  const saving=w.price-hit.price;
  return `<div class="matchline">
    🙋 ${w.name} 求《${w.title}》预算¥${w.price}
    <span class="arrow">→</span>
    📚 《${hit.title}》¥${hit.price}（${hit.seller}）
    <span class="rate">匹配度 ${hit.title.includes(w.title.slice(0,4))?"95%":"80%"}${saving>0?" · 预算内省 ¥"+saving:""}</span>
  </div>`}).join("");
 $("matchList").innerHTML=lines||'<div class="matchline">暂无求购需求</div>';
}
